name: Update Google Scholar Publications

# Disabled schedule and workflow_dispatch triggers
# on:
#   schedule:
#     - cron: '0 8 * * 1'  # Every Monday at 8:00 UTC
#   workflow_dispatch:

# The rest of the workflow is preserved for future use.
jobs:
  update-pubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly and pyyaml
        run: pip install scholarly pyyaml

      - name: Fetch Google Scholar publications
        run: python .github/scripts/fetch_scholar.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/pubs.yml
          git diff --cached --quiet || git commit -m "Update publications from Google Scholar"
          git